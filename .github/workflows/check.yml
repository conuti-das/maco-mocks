name: Prüfen

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, curl, mbstring
          coverage: none

      - name: Mocks prüfen
        run: php tools/validate.php

      - name: Tests
        run: php tests/run.php
